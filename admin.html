<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Horario de Pruebas IB</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-grid{display:grid;gap:1rem}.status{padding:.8rem 1rem;border-radius:10px;background:#f4f6f8}.status.open{background:#eaf7ee}.status.closed{background:#f5f5f5}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.field label{display:block;font-weight:600}.field select,.field input{width:100%;margin-top:.35rem;padding:.7rem;border:1px solid #ccc;border-radius:8px}.program-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem;border:1px solid #ddd;border-radius:10px}.muted{color:#666}.danger{border-color:#a33a3a;color:#a33a3a}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.program-row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header class="topbar"><div><strong>Horario de Pruebas</strong><span>Administración</span></div><div id="auth-status">No autenticado</div></header>
<main class="container">
<section id="login-panel" class="card narrow"><h1>Administración</h1><p class="muted">Acceso exclusivo del administrador.</p><button id="login-google" class="primary full" type="button">Continuar con Google</button><p id="login-message" class="muted"></p></section>
<section id="admin-app" hidden class="admin-grid">
<section class="card"><div style="display:flex;justify-content:space-between;gap:1rem;align-items:center"><div><h1>Programaciones</h1><p class="muted">Cree y controle la programación que utilizarán los docentes.</p></div><button id="logout" class="secondary" type="button">Cerrar sesión</button></div></section>
<section class="card"><h2>Programación activa</h2><div id="active-box" class="status">Cargando…</div></section>
<section class="card"><h2>Crear programación</h2><div class="form-grid">
<div class="field"><label for="year">Curso lectivo</label><input id="year" type="number" min="2020" max="2100" value="2026"></div>
<div class="field"><label for="period">Periodo</label><select id="period"><option value="I">I</option><option value="II">II</option></select></div>
<div class="field"><label for="tests">Pruebas</label><select id="tests"><option value="I">I</option><option value="II">II</option></select></div>
</div><div class="actions"><button id="create" class="primary" type="button">Crear programación</button></div><p id="message" class="muted"></p></section>
<section class="card"><h2>Historial</h2><div id="program-list" class="admin-grid"><p class="muted">Cargando…</p></div></section>
</section></main>
<script type="module" src="js/admin.js?v=20260824-2"></script>
</body></html>
